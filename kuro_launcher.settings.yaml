paths:
  ROOT: "${HERE}"
  open_llm_vtuber_dir: "${ROOT}\\Open-LLM-VTuber"
  characters_dir: "${open_llm_vtuber_dir}\\characters"
  projects_dir: "${ROOT}\\projects"
  bridge_dir: "${ROOT}\\bridges"
  env_llm: "${ROOT}\\envs\\kuro-llm310"
  runtime_conf_path: "${open_llm_vtuber_dir}\\conf.launcher_runtime.yaml"
  logs_dir: "${ROOT}\\launcher_logs"
  pet_electron_dir: "${ROOT}\\pet-electron"
  pet_electron_preferred: true

startup_profile:
  character: "kuro"
  project: "desktop-agent-runtime"
  outfit: "hoodie"
  auto_start: true

network:
  bridge:
    host: "127.0.0.1"
    port: 1188
  tts:
    host: "127.0.0.1"
    port: 18890
    mode: central
    voices:
      kuro: kuro
      yumi: yuki
  llm:
    host: "127.0.0.1"
    port: 23456
  pet_control:
    host: "127.0.0.1"
    port: 23567

core:
  # One Core API host; Schedule and read-only integrations retain separate owners.
  enabled: true
  port: 23569
  timezone: "Asia/Taipei"
  db_path: "${ROOT}/local_state/core/work.sqlite3"
  integrations:
    study:
      # Opt in explicitly; enabling does not refresh or ingest the handoff.
      enabled: false
      snapshot_path: "${open_llm_vtuber_dir}/private/study/study_snapshot.json"
      ttl_seconds: 3600
      max_bytes: 2097152
    mail:
      # Opt in explicitly; share this handoff path with the existing Mail producer.
      enabled: false
      status_path: "${open_llm_vtuber_dir}/private/gmail/mail_status.json"
      work_path: "${open_llm_vtuber_dir}/private/gmail/mail_work.json"
      work_max_bytes: 2097152
      ttl_seconds: 1800
      max_bytes: 65536

bridge:
  translate_path: "/translate"
  debug_path: "/translate_debug"

llm:
  provider_env: "KURO_LLM_PROVIDER"
  default_provider: "openai_llm"
  openai:
    model_env: "OPENAI_LLM_MODEL"
    default_model: "gpt-5-mini"
    models:
      - "gpt-5-mini"
      - "gpt-4o"
      - "gpt-4o-mini"
    temperature_env: "OPENAI_LLM_TEMPERATURE"
    inject_key_env: "OPENAI_LLM_INJECT_KEY"
    api_key_env: "OPENAI_LLM_API_KEY"
    fallback_api_key_env: "OPENAI_API_KEY"
